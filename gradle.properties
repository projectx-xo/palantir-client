org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom / Minecraft
minecraft_version=1.18.2
yarn_mappings=1.18.2+build.4
loader_version=0.14.22

# Mod
# Base version for local dev builds. CI overrides this with -Pmod_version=<base>.<n>,
# where <n> is an incrementing build number computed from existing GitHub releases.
mod_version=1.0
maven_group=com.perplexddev.shardtracker
archives_base_name=shardtracker

# Dependencies (all compatible with Minecraft 1.18.2)
fabric_version=0.77.0+1.18.2
cloth_config_version=6.2.62
modmenu_version=3.2.5
junit_version=5.10.2
