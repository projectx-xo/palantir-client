org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom / Minecraft
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3

# Mod
# Base version for local dev builds. CI overrides this with -Pmod_version=<base>.<n>,
# where <n> is an incrementing build number computed from existing GitHub releases.
mod_version=1.0
maven_group=com.perplexddev.palantir
archives_base_name=palantir

# Dependencies (all compatible with Minecraft 1.21.1)
fabric_version=0.116.15+1.21.1
cloth_config_version=15.0.140
modmenu_version=11.0.4
junit_version=5.10.2
