name: Build and Release

on:
  push:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'RELEASE')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute next build number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          JQ_FILTER='[.[].tagName | select(startswith("v'"$BASE"'.")) | ltrimstr("v'"$BASE"'.") | select(test("^[0-9]+$")) | tonumber] | max // 0'
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq "$JQ_FILTER")
          NEXT=$((LATEST + 1))
          VERSION="$BASE.$NEXT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew clean build --console=plain -Pmod_version=${{ steps.version.outputs.version }}

      - name: Compute release metadata
        id: meta
        run: |
          {
            echo 'commit_message<<EOF'
            git log -1 --pretty=%B
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Shard Tracker v${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            ${{ steps.meta.outputs.commit_message }}
          files: |
            build/libs/*.jar
          fail_on_unmatched_files: true
