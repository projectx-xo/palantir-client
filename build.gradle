plugins {
    id 'fabric-loom' version '1.6.12'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Cloth Config'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Mod Menu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

def remapJarTask = tasks.named('remapJar')
def verifyModMetadata = tasks.register('verifyModMetadata') {
    group = 'verification'
    description = 'Verifies the remapped JAR declares its configured Minecraft version and author.'

    dependsOn remapJarTask

    doLast {
        File jarFile = remapJarTask.get().archiveFile.get().asFile
        Map metadata
        java.util.zip.ZipFile archive = new java.util.zip.ZipFile(jarFile)
        try {
            def manifestEntry = archive.getEntry('fabric.mod.json')
            if (manifestEntry == null) {
                throw new GradleException('fabric.mod.json is missing from ' + jarFile.name)
            }
            metadata = (Map) new groovy.json.JsonSlurper().parse(archive.getInputStream(manifestEntry))
        } finally {
            archive.close()
        }

        String expectedMinecraft = '~' + project.minecraft_version
        String actualMinecraft = metadata.depends?.minecraft
        if (actualMinecraft != expectedMinecraft) {
            throw new GradleException(
                    'fabric.mod.json declares Minecraft ' + actualMinecraft + '; expected ' + expectedMinecraft)
        }
        if (!metadata.authors?.contains('Perplexd Development')) {
            throw new GradleException(
                    'fabric.mod.json must credit Perplexd Development; found ' + metadata.authors)
        }
    }
}

tasks.named('check') {
    dependsOn verifyModMetadata
}
